<body>

<div class="bg-hearts" id="hearts"></div>

<div class="container">

</section>

  <div class="envelope" id="envelope"><div class="flap"></div></div>
  <p style="margin-top:15px">📮 Click to open</p>

  <div class="letter-content">
    <p style="margin-top:30px; line-height:1.8; font-style:italic;">
      Your love letter goes here 💌
    </p>
  </div>
</section>

        <p>Memory caption ❤️</p>
      </div>

      <div class="carousel-slide">
        <img src="images/photo2.jpg" loading="lazy">
        <p>Another memory ✨</p>
      </div>

      <div class="carousel-slide">
        <img src="images/photo3.jpg" loading="lazy">

      </div>

    <button class="carousel-btn next">❯</button>
  </div>
</section>

  <p id="saveMsg" style="display:none; margin-top:20px;">
    Screenshot this page and keep it forever ❤️
  </p>
</section>

<audio id="sparkleSound">

<script>
const hearts = document.getElementById("hearts");
const emojis = ["💕","💖","💗","💘","💝"];

setInterval(() => {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  h.style.left = Math.random()*100 + "%";
  hearts.appendChild(h);
  setTimeout(() => h.remove(), 16000);
}, 2500);

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const buttons = document.getElementById("buttons");
const success = document.getElementById("success");

let attempts = 0;

noBtn.addEventListener("mouseenter", () => {
  attempts++;
  const rect = buttons.getBoundingClientRect();

  noBtn.style.left = Math.random() * (rect.width - 100) + "px";
  noBtn.style.top = Math.random() * 80 + "px";

  yesBtn.style.transform = `scale(${1 + attempts*0.15})`;
  if (attempts > 6) noBtn.style.display = "none";
});

const bgMusic = document.getElementById("bgMusic");
bgMusic.volume = 0.28;

yesBtn.onclick = () => {
  buttons.style.display = "none";
  success.classList.add("show");
  bgMusic.play().catch(()=>{});
  document.body.classList.add("night");
  success.scrollIntoView({ behavior: "smooth" });
};

const envelope = document.getElementById("envelope");
let opened = false;

envelope.onclick = () => {
  envelope.classList.toggle("open");
  if (!opened) {
    document.getElementById("sparkleSound").play().catch(()=>{});
    opened = true;
  }
};

const toggle = document.getElementById("musicToggle");
toggle.onclick = () => {
  if (bgMusic.paused) {
    bgMusic.play();
    toggle.textContent = "🔇 Mute";
  } else {
    bgMusic.pause();
    toggle.textContent = "🎵 Music";
  }
};

const track = document.querySelector(".carousel-track");
const slides = document.querySelectorAll(".carousel-slide");
const nextBtn = document.querySelector(".next");
const prevBtn = document.querySelector(".prev");

let index = 0;

function updateCarousel() {
  track.style.transform = `translateX(-${index * 100}%)`;
}

nextBtn.onclick = () => { index = (index + 1) % slides.length; updateCarousel(); };
prevBtn.onclick = () => { index = (index - 1 + slides.length) % slides.length; updateCarousel(); };

// Swipe support
let startX = 0;

track.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

track.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;
  if (startX - endX > 50) nextBtn.click();
  if (endX - startX > 50) prevBtn.click();
});

const saveBtn = document.getElementById("saveBtn");
const saveMsg = document.getElementById("saveMsg");

saveBtn.onclick = async () => {
  saveMsg.style.display = "block";

  if (navigator.vibrate) {
    navigator.vibrate([50,30,50]);
  }

  if ('share' in navigator) {
    try {
      await navigator.share({
        title: 'Our Memory ❤️',
        text: 'Look what I made for you',
        url: window.location.href
      });
    } catch {}
  }
};
</script>

</body>
